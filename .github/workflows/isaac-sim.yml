# Headless Isaac Sim on a DreamLake GPU machine: installs Isaac Sim from NVIDIA's
# pip index onto the node's own disk, drops rigid cubes on a ground plane, steps
# physics (and optionally RTX rendering) and checks the result.
# ~5 min; up to ~15 min on a node that has not installed Isaac Sim yet (install +
# shader compilation, both cached on the node afterwards).
name: isaac-sim
on:
  workflow_dispatch:
    inputs:
      sim_seconds:
        description: Wall-clock seconds to keep stepping the simulation (after install)
        default: "120"
      render:
        description: Also render a camera with RTX
        type: boolean
        default: true
      isaacsim_version:
        description: isaacsim pip version (5.1 crashes on NVIDIA 610 drivers; 6.x runs on 580 and 610)
        default: "6.2.0"
      machine:
        description: DreamLake GPU machine type
        type: choice
        options: [blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404, blacksmith-4vcpu-gpu-rtxpro6000-ubuntu-2404]
        default: blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404
jobs:
  isaac-sim:
    runs-on: ${{ inputs.machine || 'blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404' }}
    # Below the machine type's own time limit (2 h on these labels).
    timeout-minutes: 60
    env:
      # Passed through env, never ${{ inputs.* }} inside run: (script injection).
      SIM_SECONDS: ${{ inputs.sim_seconds || '120' }}
      RENDER: ${{ inputs.render }}
      ISAACSIM_VERSION: ${{ inputs.isaacsim_version || '6.2.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Isaac Sim
        run: examples/isaac-sim/run.sh outputs
      # Keeps outputs/ on the run's DreamLake page, whether the job passed or not.
      - uses: dreamlake-ai/cict-evidence@v1
        if: always()
        with:
          path: outputs
