# GPU smoke test on a DreamLake GPU machine: the GPU is visible and does real
# work (an fp16 matmul benchmark with PyTorch). The quickest first run (~3 min
# the first time while PyTorch downloads into the cache, ~1 min after).
name: gpu
on:
  workflow_dispatch:
    inputs:
      machine:
        description: DreamLake GPU machine type
        type: choice
        options: [dreamlake-gpu-rtx5090, dreamlake-gpu-rtxpro6000]
        default: dreamlake-gpu-rtx5090
  # Run it on every pull request as well (each run is billed):
  # pull_request:
jobs:
  gpu:
    # A DreamLake GPU label; see the machine catalog in CI / CT → Setup.
    runs-on: ${{ inputs.machine || 'dreamlake-gpu-rtx5090' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # uv and everything it downloads live in $DREAMLAKE_CACHE_DIR, which
      # outlives the single-use runner: the second run reuses them.
      - name: Install uv (cached)
        run: |
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/0.9.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "UV_CACHE_DIR=${DREAMLAKE_CACHE_DIR:-$RUNNER_TEMP}/uv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${DREAMLAKE_CACHE_DIR:-$RUNNER_TEMP}/python" >> "$GITHUB_ENV"

      - name: Check the GPU
        run: uv run --python 3.12 --with "torch>=2.7" python examples/gpu/check.py --out outputs

      # Keeps outputs/ on the run's DreamLake page, whether the job passed or not.
      - uses: dreamlake-ai/cict-evidence@v1
        if: always()
        with:
          path: outputs
