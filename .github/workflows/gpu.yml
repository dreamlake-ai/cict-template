# GPU smoke test on a DreamLake GPU machine: the GPU is visible and does real
# work (an fp16 matmul benchmark with PyTorch). The quickest first run (~3 min
# the first time while PyTorch downloads into the cache, ~1 min after).
name: gpu
on:
  workflow_dispatch:
    inputs:
      machine:
        description: DreamLake GPU machine type
        type: choice
        options: [blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404, blacksmith-4vcpu-gpu-rtxpro6000-ubuntu-2404]
        default: blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404
  # Run it on every pull request as well (each run is billed):
  # pull_request:
jobs:
  gpu:
    # A DreamLake GPU label; see the machine catalog in CI / CT → Setup.
    runs-on: ${{ inputs.machine || 'blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the GPU
        run: uv run --python 3.12 --with "torch>=2.7" python examples/gpu/check.py --out outputs

      # Keeps outputs/ on the run's DreamLake page, whether the job passed or not.
      - uses: dreamlake-ai/cict-evidence@v1
        if: always()
        with:
          path: outputs
