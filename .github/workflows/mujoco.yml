# MuJoCo on a DreamLake GPU machine: a two-link arm tracks a trajectory with a
# PD controller; the job checks the tracking error and renders a video headless
# (EGL) and the joint angles, which DreamLake's viewer replays together (.dreamrc). ~2 min the first time (MuJoCo downloads into the cache), ~1 min after.
name: mujoco
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Simulated seconds
        default: "20"
      render:
        description: Render a video (episodes/arm/camera.mp4)
        type: boolean
        default: true
      machine:
        description: DreamLake GPU machine type
        type: choice
        options: [blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404, blacksmith-4vcpu-gpu-rtxpro6000-ubuntu-2404]
        default: blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404
  # Run it on every pull request as well (each run is billed):
  # pull_request:
jobs:
  mujoco:
    runs-on: ${{ inputs.machine || 'blacksmith-4vcpu-gpu-rtx5090-ubuntu-2404' }}
    timeout-minutes: 20
    env:
      SECONDS_TO_SIMULATE: ${{ inputs.seconds || '20' }}
      RENDER: ${{ inputs.render || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Simulate
        run: |
          uv run --python 3.12 --with "mujoco>=3.2" --with "imageio[ffmpeg]" \
            python examples/mujoco/sim.py --out outputs --seconds "$SECONDS_TO_SIMULATE" --render "$RENDER"

      # Keeps outputs/ on the run's DreamLake page, whether the job passed or not.
      - uses: dreamlake-ai/cict-evidence@v1
        if: always()
        with:
          path: outputs
