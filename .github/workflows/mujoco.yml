# MuJoCo on a DreamLake GPU machine: a two-link arm tracks a trajectory with a
# PD controller; the job checks the tracking error and renders a video headless
# (EGL). ~2 min the first time (MuJoCo downloads into the cache), ~1 min after.
name: mujoco
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Simulated seconds
        default: "20"
      render:
        description: Render a video (arm.mp4)
        type: boolean
        default: true
  # Run it on every pull request as well (each run is billed):
  # pull_request:
jobs:
  mujoco:
    runs-on: dreamlake-gpu-rtx5090
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl            # headless rendering on the GPU
      SECONDS_TO_SIMULATE: ${{ inputs.seconds || '20' }}
      RENDER: ${{ inputs.render || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (cached)
        run: |
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/0.9.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "UV_CACHE_DIR=${DREAMLAKE_CACHE_DIR:-$RUNNER_TEMP}/uv" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=${DREAMLAKE_CACHE_DIR:-$RUNNER_TEMP}/python" >> "$GITHUB_ENV"

      - name: Simulate
        run: |
          uv run --python 3.12 --with "mujoco>=3.2" --with "imageio[ffmpeg]" \
            python examples/mujoco/sim.py --out outputs --seconds "$SECONDS_TO_SIMULATE" --render "$RENDER"

      - name: Save evidence
        if: always()
        run: python3 ci/evidence.py outputs
